# LiteLLM config — routes requests to Ollama models
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # General / Vision model
  - model_name: "qwen3.5:27b"
    litellm_params:
      model: "ollama/qwen3.5:27b"
      api_base: "http://host.docker.internal:11434"

  # Coding model
  - model_name: "devstral:24b"
    litellm_params:
      model: "ollama/devstral:24b"
      api_base: "http://host.docker.internal:11434"

  # Fast/small model for quick tasks
  - model_name: "qwen3.5:9b"
    litellm_params:
      model: "ollama/qwen3.5:9b"
      api_base: "http://host.docker.internal:11434"

  # Embeddings for RAG (Docs AI)
  - model_name: "nomic-embed-text"
    litellm_params:
      model: "ollama/nomic-embed-text"
      api_base: "http://host.docker.internal:11434"

litellm_settings:
  # Log to stdout
  success_callback: []
  # Timeout for long model responses
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Disable telemetry
  disable_spend_logs: false
